<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    
* {
    box-sizing: border-box;
}

body {
    margin: 20px;
}

.cont {
    width: 400px;
    height: 400px;
    border: 2px solid black;
    border-radius: 2px;
    box-shadow: 15px 20px 25px rgb(126, 104, 76);

    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.box1 {
    width: 100%;
    height: 180px;
    border-radius: 2px;
    flex-shrink: 0;
    
    padding: 0;
}

.box1 img {
    display: block;
    width: 100%;
    border-radius: 2px;
    height: 100%;
    object-fit: cover;
}

.box2 {
    width: 100%;
    flex: 1;
    min-height: 0;
    
    padding: 10px;
    overflow: auto;
}

.box2 p {
    margin: 0;
}






    </style>
</head>
<body>
    <div class="cont">
        <div class="box1">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRe-VHF38UrPvLSgyzfR1PE_pfZuiMa-m4S1R0JvMBKlQ&s=10" alt="">
        </div>
            
        <div class="box2">
            
        </div>

    </div>
</body>
</html>
