<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>

</head>
<body>
    <fieldset>
        <legend>Login Page</legend>
        <form action="login.html">
            Username:
            <input type="text" name="un" value="Abc"><br><br>
            password
            <input type="password" name="pw" required><br><br>
            <label for="">email</label>
            <input type="email"><br><br>
            <label for="">age</label>
            <input type="number"><br><br>
            <label for="">phone</label>
            <input type="tel"><br><br>
            <label for="">DOB</label>
            <input type="date"><br><br>
            <label for="">gender</label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female <br><br>
            <label for="">Languages known</label>
            <input type="checkbox">Telugu
            <input type="checkbox">English
            <input type="checkbox">Kannada
            <input type="checkbox">Malayalam
            <input type="checkbox">Hindi
            <input type="checkbox">Marati <br><br>
            <input type="range"><br><br>
            <input type="color"><br><br>
            <label for="">Job location</label>
            <select name="" id="">
                <option value="">Mangalore</option>
                <option value="">Madikeri</option>
                <option value="">puttur</option>
                <option value="">Mysore</option>
                <option value="">Kerala</option>
            </select>
            <label for="">Adress</label>
            
            <input type="submit">
        </form>
    </fieldset>
</body>
</html>
